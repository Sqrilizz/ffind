name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            suffix: ""
          - target: x86_64-unknown-linux-musl
            suffix: "-musl"
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          strip "target/${{ matrix.target }}/release/ffind"
          install -D "target/${{ matrix.target }}/release/ffind" \
            "ffind-${GITHUB_REF_NAME}-x86_64-linux${{ matrix.suffix }}/ffind"
          tar -czf "ffind-${GITHUB_REF_NAME}-x86_64-linux${{ matrix.suffix }}.tar.gz" \
            "ffind-${GITHUB_REF_NAME}-x86_64-linux${{ matrix.suffix }}"
          sha256sum "ffind-${GITHUB_REF_NAME}-x86_64-linux${{ matrix.suffix }}.tar.gz" \
            > "ffind-${GITHUB_REF_NAME}-x86_64-linux${{ matrix.suffix }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: "ffind-${{ github.ref_name }}-x86_64-linux*"

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest
