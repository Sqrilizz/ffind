[package]
name = "ffind"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "High-performance, multi-threaded file finder for Linux with gitignore support, fuzzy matching, and JSON streaming"
license = "MIT"
repository = "https://github.com/Sqrilizz/ffind"
readme = "README.md"
keywords = ["find", "search", "files", "cli", "walker"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.30", features = ["derive"] }
clap_complete = "4.6.11"
crossbeam-channel = "0.5.14"
crossbeam-deque = "0.8.6"
globset = "0.4.15"
ignore = "0.4.30"
libc = "0.2.169"
memchr = "2.7.4"
regex = "1.11.1"
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
