[package]
name = "ffind"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[dependencies]
anyhow = "1.0.95"
clap = { version = "4.5.30", features = ["derive"] }
clap_complete = "4.6.11"
crossbeam-channel = "0.5.14"
crossbeam-deque = "0.8.6"
globset = "0.4.15"
ignore = "0.4.30"
libc = "0.2.169"
memchr = "2.7.4"
regex = "1.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
